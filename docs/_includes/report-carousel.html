<style>
  .report-carousel {
    max-width: 600px;
    margin: 1rem auto;
    background: #f8f9fa;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    overflow: hidden;
  }

  .carousel-container {
    position: relative;
    width: 100%;
    aspect-ratio: 8.5 / 10;
    background: white;
    overflow: hidden;
    max-height: 500px;
  }

  .carousel-slide {
    display: none;
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    opacity: 0;
    transition: opacity 0.4s ease-in-out;
  }

  .carousel-slide.active {
    display: block;
    opacity: 1;
  }

  .carousel-slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .carousel-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem;
    background: #f8f9fa;
    gap: 1rem;
  }

  .carousel-button {
    background: #0969da;
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 500;
    transition: background 0.2s;
  }

  .carousel-button:hover {
    background: #0860ca;
  }

  .carousel-button:disabled {
    background: #d0d7de;
    cursor: not-allowed;
  }

  .carousel-info {
    flex: 1;
    text-align: center;
    font-size: 0.9rem;
    color: #57606a;
    font-weight: 500;
  }

  .carousel-dot-container {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin-top: 0.5rem;
  }

  .carousel-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #d0d7de;
    cursor: pointer;
    transition: background 0.2s;
  }

  .carousel-dot.active {
    background: #0969da;
  }

  .carousel-dot:hover {
    background: #0860ca;
  }
</style>

<div class="report-carousel">
  <div class="carousel-container">
    <div class="carousel-slide active">
      <img src="https://raw.githubusercontent.com/ivadomed/SpineReport/main/spinereport/resources/imgs/report_first_page.png" alt="Report - First Page">
    </div>
    <div class="carousel-slide">
      <img src="https://raw.githubusercontent.com/ivadomed/SpineReport/main/spinereport/resources/imgs/report_canal.png" alt="Report - Canal">
    </div>
    <div class="carousel-slide">
      <img src="https://raw.githubusercontent.com/ivadomed/SpineReport/main/spinereport/resources/imgs/report_discs.png" alt="Report - Discs">
    </div>
    <div class="carousel-slide">
      <img src="https://raw.githubusercontent.com/ivadomed/SpineReport/main/spinereport/resources/imgs/report_vertebrae.png" alt="Report - Vertebrae">
    </div>
    <div class="carousel-slide">
      <img src="https://raw.githubusercontent.com/ivadomed/SpineReport/main/spinereport/resources/imgs/report_foramens.png" alt="Report - Foramens">
    </div>
    <div class="carousel-slide">
      <img src="https://raw.githubusercontent.com/ivadomed/SpineReport/main/spinereport/resources/imgs/report_csf.png" alt="Report - CSF">
    </div>
  </div>
  
  <div class="carousel-controls">
    <button class="carousel-button" id="carousel-prev" data-carousel-button="prev">← Previous</button>
    <div class="carousel-info">
      <div id="carousel-page">Page 1 of 6</div>
      <div class="carousel-dot-container" id="carousel-dots"></div>
    </div>
    <button class="carousel-button" id="carousel-next" data-carousel-button="next">Next →</button>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const carousel = document.querySelector('.report-carousel');
    if (!carousel) return;

    const slides = carousel.querySelectorAll('.carousel-slide');
    const totalSlides = slides.length;
    let currentSlide = 0;

    const prevBtn = carousel.querySelector('[data-carousel-button="prev"]');
    const nextBtn = carousel.querySelector('[data-carousel-button="next"]');
    const pageInfo = carousel.querySelector('#carousel-page');
    const dotsContainer = carousel.querySelector('#carousel-dots');

    // Create dots
    for (let i = 0; i < totalSlides; i++) {
      const dot = document.createElement('div');
      dot.classList.add('carousel-dot');
      if (i === 0) dot.classList.add('active');
      dot.setAttribute('data-slide', i);
      dot.addEventListener('click', () => goToSlide(i));
      dotsContainer.appendChild(dot);
    }

    const dots = carousel.querySelectorAll('.carousel-dot');

    function updateCarousel() {
      // Update slides
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === currentSlide);
      });

      // Update dots
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentSlide);
      });

      // Update page info
      pageInfo.textContent = `Page ${currentSlide + 1} of ${totalSlides}`;

      // Update button states
      prevBtn.disabled = currentSlide === 0;
      nextBtn.disabled = currentSlide === totalSlides - 1;
    }

    function goToSlide(n) {
      currentSlide = Math.max(0, Math.min(n, totalSlides - 1));
      updateCarousel();
    }

    prevBtn.addEventListener('click', function(e) {
      e.preventDefault();
      goToSlide(currentSlide - 1);
    });
    
    nextBtn.addEventListener('click', function(e) {
      e.preventDefault();
      goToSlide(currentSlide + 1);
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') goToSlide(currentSlide - 1);
      if (e.key === 'ArrowRight') goToSlide(currentSlide + 1);
    });

    updateCarousel();
  });
</script>
