<style>
  .report-carousel {
    max-width: 600px;
    margin: 1rem auto;
    background: #f8f9fa;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    overflow: hidden;
  }

  .carousel-container {
    position: relative;
    width: 100%;
    aspect-ratio: 8.5 / 10;
    background: white;
    overflow: hidden;
    max-height: 500px;
  }

  .carousel-slide {
    display: none;
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    opacity: 0;
    transition: opacity 0.4s ease-in-out;
  }

  .carousel-slide.active {
    display: block;
    opacity: 1;
  }

  .carousel-slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .carousel-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem;
    background: #f8f9fa;
    gap: 1rem;
  }

  .carousel-button {
    background: #3aa03a;
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 500;
    transition: background 0.2s;
  }

  .carousel-button:hover {
    background: #2d7a2d;
  }

  .carousel-button:disabled {
    background: #d0d7de;
    cursor: not-allowed;
  }

  .carousel-info {
    flex: 1;
    text-align: center;
    font-size: 0.9rem;
    color: #57606a;
    font-weight: 500;
  }

  .carousel-dot-container {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin-top: 0.5rem;
  }

  .carousel-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #d0d7de;
    cursor: pointer;
    transition: background 0.2s;
  }

  .carousel-dot.active {
    background: #3aa03a;
  }

  .carousel-dot:hover {
    background: #2d7a2d;
  }
</style>

<div class="report-carousel">
  <div class="carousel-container">
    <div class="carousel-slide active">
      <img src="https://raw.githubusercontent.com/ivadomed/SpineReport/main/spinereport/resources/imgs/report_first_page.png" alt="Report - First Page">
    </div>
    <div class="carousel-slide">
      <img src="https://raw.githubusercontent.com/ivadomed/SpineReport/main/spinereport/resources/imgs/report_canal.png" alt="Report - Canal">
    </div>
    <div class="carousel-slide">
      <img src="https://raw.githubusercontent.com/ivadomed/SpineReport/main/spinereport/resources/imgs/report_discs.png" alt="Report - Discs">
    </div>
    <div class="carousel-slide">
      <img src="https://raw.githubusercontent.com/ivadomed/SpineReport/main/spinereport/resources/imgs/report_vertebrae.png" alt="Report - Vertebrae">
    </div>
    <div class="carousel-slide">
      <img src="https://raw.githubusercontent.com/ivadomed/SpineReport/main/spinereport/resources/imgs/report_foramens.png" alt="Report - Foramens">
    </div>
    <div class="carousel-slide">
      <img src="https://raw.githubusercontent.com/ivadomed/SpineReport/main/spinereport/resources/imgs/report_csf.png" alt="Report - CSF">
    </div>
  </div>
  
  <div class="carousel-controls">
    <button class="carousel-button" id="carousel-prev" data-carousel-button="prev">← Previous</button>
    <div class="carousel-info">
      <div id="carousel-page">Page 1 of 6</div>
      <div class="carousel-dot-container" id="carousel-dots"></div>
    </div>
    <button class="carousel-button" id="carousel-next" data-carousel-button="next">Next →</button>
  </div>
</div>
